<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa"/>
  
  <!-- Main circular path (learning cycle) -->
  <g transform="translate(100, 100)">
    <!-- Outer ring with gradient -->
    <circle cx="0" cy="0" r="60" stroke="url(#primaryGrad)" stroke-width="8" fill="none" opacity="0.2"/>
    
    <!-- Progressive arc segments (evolution/learning stages) -->
    <path d="M 0,-60 A 60,60 0 0,1 42.4,-42.4" 
          stroke="url(#primaryGrad)" 
          stroke-width="8" 
          fill="none" 
          opacity="0.9"
          stroke-linecap="round"/>
    
    <path d="M 42.4,-42.4 A 60,60 0 0,1 60,0" 
          stroke="url(#primaryGrad)" 
          stroke-width="8" 
          fill="none" 
          opacity="0.7"
          stroke-linecap="round"/>
    
    <path d="M 60,0 A 60,60 0 0,1 42.4,42.4" 
          stroke="url(#primaryGrad)" 
          stroke-width="8" 
          fill="none" 
          opacity="0.5"
          stroke-linecap="round"/>
    
    <!-- Center core (knowledge base) -->
    <circle cx="0" cy="0" r="35" fill="url(#primaryGrad)" opacity="0.15"/>
    
    <!-- Inner rotating elements (data points / insights) -->
    <g opacity="0.8">
      <!-- Top node (failure point) -->
      <circle cx="0" cy="-25" r="6" fill="#ef4444"/>
      <circle cx="0" cy="-25" r="10" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.3"/>
      
      <!-- Right node (analysis) -->
      <circle cx="22" cy="-12" r="5" fill="url(#primaryGrad)"/>
      
      <!-- Bottom right (solution) -->
      <circle cx="22" cy="12" r="5" fill="#10b981"/>
      
      <!-- Bottom (learning) -->
      <circle cx="0" cy="25" r="7" fill="url(#accentGrad)" filter="url(#glow)"/>
      
      <!-- Left node (context) -->
      <circle cx="-22" cy="0" r="4" fill="url(#primaryGrad)" opacity="0.6"/>
    </g>
    
    <!-- Connection lines (neural network / data flow) -->
    <g stroke="url(#primaryGrad)" stroke-width="2" opacity="0.3">
      <line x1="0" y1="-25" x2="22" y2="-12"/>
      <line x1="22" y1="-12" x2="22" y2="12"/>
      <line x1="22" y1="12" x2="0" y2="25"/>
      <line x1="0" y1="25" x2="-22" y2="0"/>
      <line x1="-22" y1="0" x2="0" y2="-25"/>
    </g>
  </g>
  
  <!-- Rotating arrow (continuous improvement) -->
  <g transform="translate(100, 100)" opacity="0.9">
    <path d="M 42,-42 A 60,60 0 0,1 45,-38" 
          stroke="url(#accentGrad)" 
          stroke-width="5" 
          fill="none" 
          stroke-linecap="round"
          filter="url(#glow)"/>
    <polygon points="45,-38 38,-33 42,-40" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>
  
  <!-- Outer accent dots (progress indicators) -->
  <g fill="url(#primaryGrad)" opacity="0.4">
    <circle cx="100" cy="25" r="3"/>
    <circle cx="155" cy="55" r="3"/>
    <circle cx="175" cy="100" r="3"/>
    <circle cx="155" cy="145" r="3"/>
    <circle cx="100" cy="175" r="3"/>
    <circle cx="45" cy="145" r="3"/>
    <circle cx="25" cy="100" r="3"/>
    <circle cx="45" cy="55" r="3"/>
  </g>
  
  <!-- Success indicator (top right accent) -->
  <g transform="translate(160, 40)">
    <circle cx="0" cy="0" r="8" fill="#10b981" opacity="0.2"/>
    <path d="M -3,0 L -1,3 L 4,-4" 
          stroke="#10b981" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>